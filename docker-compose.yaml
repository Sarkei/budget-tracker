services:
  budget-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget-tracker
    restart: unless-stopped
    ports:
      - "11111:11111"
    volumes:
      # SQLite database persisted on host — change ./data to any path on your NAS
      - ./data:/app/data
      # Bankumsätze aus dem EnableBanking-Abruf (nur lesend, wird beim Start importiert)
      - /home/hermes-agent/hermes-data/finance/transaktionen:/data/bank:ro
    environment:
      - DATA_PATH=/app/data
      - BANK_DATA_PATH=/data/bank
      - OWNER_EMAIL=${OWNER_EMAIL:-nagraszust@gmail.com}
      - BANK_SYNC_HOURS=${BANK_SYNC_HOURS:-6}
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - default
      - cloudflare

networks:
  default:
    driver: bridge
  cloudflare:
    external: true
    name: cloudflare-tunnel-net